apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{.Values.httpRoute.name}}
  namespace: {{.Values.namespace}}
spec:
  parentRefs:
    - name: {{.Values.httpRoute.parentRefName}}
      sectionName: https
  hostnames:
    - {{.Values.httpRoute.hostname}}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{.Values.httpRoute.path}}
      backendRefs:
        - name: {{.Values.httpRoute.backendName}}
          port: 8080
          weight: 100