name: 001-hostname-routing

on:
    push:
        paths:
          - '001-hostname-routing/**'

env:
  ISTIO_ROUTE_VERSION: 0.4.0

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest: [istio.yaml, gateway-api.yaml]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: bin-cache
        with:
          path: ~/bin
          key: istio-route-${{ env.ISTIO_ROUTE_VERSION }}

      - name: Download istio-route
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bin
          curl -fsSL "https://github.com/ninoamine/istio-route/releases/download/v${ISTIO_ROUTE_VERSION}/istio-route_${ISTIO_ROUTE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C ~/bin
          chmod +x ~/bin/istio-route

      - name: Add to PATH
        run: echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run istio-route
        run: istio-route -f 001-hostname-routing/manifests/${{ matrix.manifest }} shop.example.com