# .github/workflows/routing-tests.yml
name: routing-tests

on:
  push:
    paths:
      - '002-routing-behavior-testing/**'
      - '.github/workflows/002-routing-behavior-testing.yml'

env:
  ISTIO_ROUTE_VERSION: 0.4.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: bin-cache
        with:
          path: ~/bin
          key: istio-route-${{ env.ISTIO_ROUTE_VERSION }}

      - name: Download istio-route
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bin
          curl -fsSL "https://github.com/ninoamine/istio-route/releases/download/v${ISTIO_ROUTE_VERSION}/istio-route_${ISTIO_ROUTE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C ~/bin
          chmod +x ~/bin/istio-route

      - name: Add to PATH
        run: echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Render prod manifests
        run: helm template shop ./002-routing-behavior-testing/gateway-api -f ./002-routing-behavior-testing/gateway-api/values-prod.yaml > prod.yaml

      - name: Run behavior tests
        run: istio-route test --manifests prod=002-routing-behavior-testing/prod.yaml 002-routing-behavior-testing/features